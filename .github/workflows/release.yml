name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '语义化版本号，例如 1.0.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Validate version
        id: version
        shell: pwsh
        env:
          HKB_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:HKB_RELEASE_VERSION
          if (-not $version) {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must use MAJOR.MINOR.PATCH, got: $version"
          }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($version -ne $tagVersion) {
              throw "Release version $version does not match tag version $tagVersion."
            }
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build-x86:
    name: Build and test x86
    needs: resolve-version
    runs-on: windows-latest
    env:
      HKB_RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Set up Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ninja --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure and build x86
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw 'The Windows runner did not provide VCPKG_INSTALLATION_ROOT.'
          }
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset x86-release "-DHKB_PROJECT_VERSION=$env:HKB_RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset x86-release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run x86 tests
        shell: pwsh
        run: |
          ctest --test-dir 'build/x86-release-vcpkg' --output-on-failure -E '^hkb_register_hotkey_injection$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload x86 runtime components
        uses: actions/upload-artifact@v4
        with:
          name: hkb-x86-runtime
          path: |
            build/x86-release-vcpkg/HotkeyHook32.dll
            build/x86-release-vcpkg/HotkeyBlockerInjector32.exe
          if-no-files-found: error

  package-x64:
    name: Build, test, and package x64
    needs: [resolve-version, build-x86]
    runs-on: windows-latest
    env:
      HKB_RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download x86 runtime components
        uses: actions/download-artifact@v4
        with:
          name: hkb-x86-runtime
          path: build/x86-release-vcpkg

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsisCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'),
            (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')
          )
          $nsis = $nsisCandidates |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $nsis) {
            throw 'NSIS installation completed, but makensis.exe was not found.'
          }
          $nsisDirectory = Split-Path -Parent $nsis
          $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $nsis /VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ninja --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure and build x64
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw 'The Windows runner did not provide VCPKG_INSTALLATION_ROOT.'
          }
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset x64-release "-DHKB_PROJECT_VERSION=$env:HKB_RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset x64-release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run x64 tests
        shell: pwsh
        run: |
          ctest --test-dir 'build/x64-release-vcpkg' --output-on-failure -E '^hkb_register_hotkey_injection$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package x64 installer
        shell: pwsh
        run: |
          cmake --build --preset x64-release --target package --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $buildDirectory = 'build/x64-release-vcpkg'
          $packageName = "HotkeyBlocker-$env:HKB_RELEASE_VERSION-x64.exe"
          $packageFile = Join-Path $buildDirectory $packageName
          if (-not (Test-Path -LiteralPath $packageFile)) {
            throw "CPack did not create the expected installer: $packageFile"
          }
          New-Item -ItemType Directory -Path 'build/packages' -Force | Out-Null
          Copy-Item -LiteralPath $packageFile -Destination 'build/packages' -Force
          $hash = (Get-FileHash -LiteralPath (Join-Path 'build/packages' $packageName) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $packageName" | Set-Content -LiteralPath (Join-Path 'build/packages' "$packageName.sha256") -Encoding ASCII

      - name: List package contents
        shell: pwsh
        run: Get-ChildItem -LiteralPath build/packages -File | Select-Object Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HotkeyBlocker-${{ github.ref_name }}
          path: build/packages/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-x64
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated installer artifact and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --name "HotkeyBlocker-$GITHUB_REF_NAME" \
            --dir artifacts \
            --repo "$GITHUB_REPOSITORY"
          version="${GITHUB_REF_NAME#v}"
          installer="artifacts/HotkeyBlocker-${version}-x64.exe"
          checksum="${installer}.sha256"
          test -f "$installer"
          test -f "$checksum"
          gh release create "$GITHUB_REF_NAME" "$installer" "$checksum" \
            --generate-notes \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY"
