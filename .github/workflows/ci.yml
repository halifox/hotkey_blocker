name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.architecture }}

      - name: Set up Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ninja --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure and build
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw 'The Windows runner did not provide VCPKG_INSTALLATION_ROOT.'
          }
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $preset = '${{ matrix.architecture }}-release'
          cmake --preset $preset
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset $preset --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify runtime artifacts
        shell: pwsh
        run: |
          $root = "build/${{ matrix.architecture }}-release-vcpkg"
          $hookName = if ('${{ matrix.architecture }}' -eq 'x64') { 'HotkeyHook64.dll' } else { 'HotkeyHook32.dll' }
          $required = @(
            "$root/HotkeyBlocker.exe",
            "$root/$hookName"
          )
          if ('${{ matrix.architecture }}' -eq 'x86') {
            $required += "$root/HotkeyBlockerInjector32.exe"
          }
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing build artifact: $file"
            }
          }

      - name: Run tests
        shell: pwsh
        run: |
          ctest --test-dir "build/${{ matrix.architecture }}-release-vcpkg" --output-on-failure -E '^hkb_register_hotkey_injection$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check patch whitespace
        shell: pwsh
        run: git diff --check
