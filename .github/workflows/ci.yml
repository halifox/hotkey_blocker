name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.architecture }}

      - name: Set up Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ninja --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure and build
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw 'The Windows runner did not provide VCPKG_INSTALLATION_ROOT.'
          }
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $preset = '${{ matrix.architecture }}-release'
          cmake --preset $preset
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset $preset --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify runtime artifacts
        shell: pwsh
        run: |
          $root = "build/${{ matrix.architecture }}-release-vcpkg"
          $hookName = if ('${{ matrix.architecture }}' -eq 'x64') { 'HotkeyHook64.dll' } else { 'HotkeyHook32.dll' }
          $required = @(
            "$root/HotkeyBlocker.exe",
            "$root/$hookName"
          )
          if ('${{ matrix.architecture }}' -eq 'x86') {
            $required += "$root/HotkeyBlockerInjector32.exe"
          }
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing build artifact: $file"
            }
          }

      - name: Run tests
        shell: pwsh
        run: |
          ctest --test-dir "build/${{ matrix.architecture }}-release-vcpkg" --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check patch whitespace
        shell: pwsh
        run: git diff --check

      - name: Upload tested injection components
        uses: actions/upload-artifact@v4
        with:
          name: injection-${{ matrix.architecture }}
          path: |
            build/${{ matrix.architecture }}-release-vcpkg/HotkeyHook*.dll
            build/${{ matrix.architecture }}-release-vcpkg/HotkeyBlockerInjector32.exe
            build/${{ matrix.architecture }}-release-vcpkg/hotkey_probe.exe
            build/${{ matrix.architecture }}-release-vcpkg/hkb_injection_test.exe
            build/${{ matrix.architecture }}-release-vcpkg/hkb_blocker_service_integration_test.exe
          if-no-files-found: error
          retention-days: 1

  cross-architecture:
    name: Test x64 to x86 injection
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download x64 test runner
        uses: actions/download-artifact@v8
        with:
          name: injection-x64
          path: runtime
      - name: Download x86 targets
        uses: actions/download-artifact@v8
        with:
          name: injection-x86
          path: runtime/win32
      - name: Verify helper injection and service lifecycle
        shell: pwsh
        run: |
          & ./runtime/hkb_injection_test.exe --win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./runtime/hkb_blocker_service_integration_test.exe --win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
